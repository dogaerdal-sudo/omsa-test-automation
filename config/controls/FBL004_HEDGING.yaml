component_id: FBL004_HEDGING
component_type: control
display_name: FBL004 Hedging
implementation_status: ready
allow_generate: true
source_of_rules: Workbook instructions + validated workbook structure
template:
  suggested_filename: TEST - FBL004 - Hedging.xlsx
  folder: templates_local/controls
inputs:
- id: vi_hedging
  label: vi_hedging
  expected_file: vi_hedging
  required: true
  status: confirmed
  accepted_formats:
  - csv
  - xlsx
  - xls
  - xlsb
  source:
    sheet_index: 1
    header_row: 1
    start_row: 2
    start_column: A
  destination:
    sheet: vi_hedging
    start_row: 2
    start_column: A
  import_mode: contiguous
  import_rules:
    skip_source_header: true
    clear_existing_data: true
    paste_values: true
    paste_formats: true
    replace_literal_NULL_with_blank: true
    fill_helper_formulas_left: true
  source_component: VI_HEDGING
  role: T
- id: fbl004_control_output
  label: FBL004 Workbench Control Output
  expected_file: FBL004 Workbench Control Output
  required: true
  status: confirmed
  accepted_formats:
  - csv
  - xlsx
  - xls
  - xlsb
  source:
    sheet_index: 1
    header_row: 1
    start_row: 2
    start_column: A
  destination:
    sheet: WorkBench - FBL004
    start_row: 2
    start_column: A
  import_mode: contiguous
  import_rules:
    skip_source_header: true
    clear_existing_data: true
    paste_values: true
    paste_formats: true
    replace_literal_NULL_with_blank: true
    fill_helper_formulas_left: true
  role: control_result
post_import_actions:
- action: copy_unique_values_filtered
  source:
    sheet: vi_hedging
    start_row: 2
    header_row: 1
    column_header: KEY_HEDGING
  filter:
    column_header: MCH_HEDGED_CLASS
    nonblank: true
  distinct_by_header: MAF_CLASS
  destination:
    sheet: Test - FBL004
    start_cell: A2
  clear_destination_before_copy: true
- action: copy_range_values
  source:
    sheet: WorkBench - FBL004
    start_row: 2
    start_column: K
    end_column: R
  destination:
    sheet: Test - FBL004
    start_cell: K2
  clear_destination_before_copy: false
- action: copy_column_values
  source:
    sheet: WorkBench - FBL004
    start_row: 2
    header_row: 1
    column_header: MCH_CODE_FUND
  destination:
    sheet: 2nd Level - Cumulated Perf
    start_cell: A2
  clear_destination_before_copy: true
excel_behavior:
  preserve_template_formulas: true
  preserve_template_formatting: true
  extend_check_formulas: true
  full_recalculation: true
  business_logic_in_python: false
result_behavior:
  source_of_truth: excel_template
  read_boolean_results: true
  scan_formula_cells_only: true
  sheet: Test - FBL004
  header_row: 1
  data_start_row: 2
  key_column: A
procedure_summary:
- vi_hedging drives the Test perimeter for populated MCH_HEDGED_CLASS values.
- FBL004 control output populates WorkBench - FBL004.
- Populated control columns K:R are copied to Test; MCH_CODE_FUND feeds the second-level key.
