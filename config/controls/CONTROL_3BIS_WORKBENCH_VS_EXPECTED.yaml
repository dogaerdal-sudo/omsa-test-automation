component_id: CONTROL_3BIS_WORKBENCH_VS_EXPECTED
component_type: control
display_name: 3BIS Workbench vs Expected
implementation_status: ready
allow_generate: true
source_of_rules: Workbook instructions + validated workbook structure
template:
  suggested_filename: 3BIS EXCEL DI CONTROLLO 2 - WORKBENCH VS EXPECTED.xlsx
  folder: templates_local/controls
inputs:
- id: excel_controllo_1_output
  label: 3BIS Excel di Controllo 1 Output
  expected_file: 3BIS Excel di Controllo 1 Output
  required: true
  status: confirmed
  accepted_formats:
  - csv
  - xlsx
  - xls
  - xlsb
  source:
    sheet_index: 1
    header_row: 1
    start_row: 2
    start_column: A
  destination:
    sheet: 3BIS
    start_row: 2
    start_column: A
  import_mode: header_match
  import_rules:
    skip_source_header: true
    clear_existing_data: true
    paste_values: true
    paste_formats: true
    replace_literal_NULL_with_blank: false
    fill_helper_formulas_left: true
    protected_destination_columns:
    - A
    - AX
    - AY
    - AZ
    - BA
    - BB
    - BC
    - BD
    - BE
    - BF
    - BG
  role: upstream_control
post_import_actions: []
excel_behavior:
  preserve_template_formulas: true
  preserve_template_formatting: true
  extend_check_formulas: true
  full_recalculation: true
  business_logic_in_python: false
result_behavior:
  source_of_truth: excel_template
  read_boolean_results: true
  scan_formula_cells_only: true
  sheet: 3BIS
  header_row: 1
  data_start_row: 2
  key_column: A
  result_columns:
  - BG
procedure_summary:
- Paste the completed Excel di Controllo 1 output into the 3BIS sheet.
- Do not overwrite formula columns A and AX:BG.
- Review the final result column BG for FALSE.
