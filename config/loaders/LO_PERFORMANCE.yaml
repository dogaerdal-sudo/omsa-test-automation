  check_sheet: CHECK
  header_row: 3
  data_start_row: 4
  key_column: A
  read_boolean_results: true
  false_as_exception: true
  formula_errors_as_error: true
procedure_summary:
- Scaricare da DB Fideuram tramite l'apposita query, i dati del loader delle performance e copiarli nello sheet "DB - lo_performance" da colonna
  A
- Scaricare da Workbench i dati del loader delle performance, sostituire i campi 'NULL' con blank e copiarli nello sheet "WorkBench - lo_performance"
  da colonna A
- Copiare i valori della colonna E "COD_COMP_CLASS" da "WorkBench - lo_performance" nello sheet CHECK da cella A4
implementation_status: ready
allow_generate: true
