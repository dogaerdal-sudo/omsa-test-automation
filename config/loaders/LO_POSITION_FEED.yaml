component_id: LO_POSITION_FEED
component_type: loader
display_name: Position Feed
last_procedure_update: 25/10/2024
template:
  suggested_filename: Test - LO_POSITION_FEED.xlsx
  folder: templates_local/loaders
inputs:
- id: db_fideuram_extract
  label: DB Fideuram Position Feed Extract
  required: true
  accepted_formats:
  - csv
  - xlsx
  - xls
  - xlsb
  source:
    sheet_index: 1
    header_row: 1
    start_row: 2
    start_column: A
  destination:
    sheet: DB - lo_position_feed
    start_row: 2
    start_column: B
  import_rules:
    skip_source_header: true
    clear_existing_data: true
    paste_values: true
    paste_formats: true
    replace_literal_NULL_with_blank: false
    fill_helper_formulas_left: true
  expected_file: DB Fideuram Position Feed Extract
  status: confirmed
- id: workbench_extract
  label: Workbench lo_position_feed
  required: true
  accepted_formats:
  - csv
  - xlsx
  - xls
  - xlsb
  source:
    sheet_index: 1
    header_row: 1
    start_row: 2
    start_column: A
  destination:
    sheet: Workbench - lo_position_feed
    start_row: 2
    start_column: B
  import_rules:
    skip_source_header: true
    clear_existing_data: true
    paste_values: true
    paste_formats: true
    replace_literal_NULL_with_blank: true
    fill_helper_formulas_left: true
  expected_file: Workbench lo_position_feed
  status: confirmed
post_import_actions:
- action: copy_column_values
  source:
    sheet: Workbench - lo_position_feed
    start_row: 2
    header_row: 1
    column_header: CHIAVE
  destination:
    sheet: CHECK
    start_cell: A4
  clear_destination_before_copy: true
excel_behavior:
  preserve_template_formulas: true
  preserve_template_formatting: true
  extend_check_formulas: true
  full_recalculation: true
  business_logic_in_python: false
result_behavior:
  source_of_truth: excel_template
  check_sheet: CHECK
  header_row: 3
  data_start_row: 4
  key_column: A
  read_boolean_results: true
  false_as_exception: true
  formula_errors_as_error: true
procedure_summary:
- Scaricare da DB Fideuram tramite l'apposita query, i dati del loader del position feed e copiarli nello sheet "DB - lo_position_feed" da colonna
  B
- Scaricare da Workbench i dati del loader del position feed, sostituire i campi 'NULL' con blank e copiarli nello sheet "WorkBench - lo_position_feed"
  da colonna B
- In colonna A di entrambi gli sheet si genererà la chiave utile alla riconciliazione
- Copiare i valori della colonna A "CHIAVE" da "WorkBench - lo_position_feed" nello sheet CHECK da cella A4
implementation_status: ready
allow_generate: true
source_of_rules: Workbook Procedura sheet
