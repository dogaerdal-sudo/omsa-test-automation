procedure_summary:
- Scaricare da DB Fideuram tramite l'apposita query, i dati del loader liquidity dalla colonna "DTA_RIF" e copiarli nello sheet "DB - lo_liquidity"
  da colonna B
- Scaricare da Workbench i dati del loader liquidity, sostituire i campi 'NULL' con blank e copiarli dalla colonna "DTA_RIF" nello sheet "WorkBench
  - lo_liquidity" da colonna B
- Copiare i valori della colonna "CHIAVE_FONDO_STRUMENTO" da "Workbench - lo_liquidity" nello sheet CHECK da cella A4
