procedure_summary:
- Nine upload fields mirror the original VBA file-selection flow.
- Source headers are skipped and each file is pasted into its defined start column.
- Anag strum AQ is aligned to reporting date and AV:AW formulas are extended.
- VI_ANAGR_FUNDS has a known A-vs-B destination conflict between supplied VBA and STEPS; current build follows the supplied VBA (A→A) and flags it for confirmation.
